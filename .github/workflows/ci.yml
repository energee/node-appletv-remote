name: CI

on:
  pull_request:
    branches: [main, pyatv-parity]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: latest
      # npm 10 crashed resolving vitest 4.1.12's peers; track the newest npm, not the bundled one.
      - run: npm install -g npm@latest
      - run: npm install
      - run: npm test

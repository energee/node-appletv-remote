name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (README: Node 20.19+), current LTS, and current release.
        node-version: ['20.19', 22, latest]
    steps:
      - uses: actions/checkout@v4
      # Install from the committed lockfile: a fresh npm resolve crashed on vitest 4.1.12's peers,
      # so CI installs with pnpm instead.
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

# pnpm 10+ skips dependency build scripts unless approved here. Without this file,
# every fresh checkout or worktree fails `pnpm install`/`pnpm exec` with
# ERR_PNPM_IGNORED_BUILDS and leaves an untracked stub of this file behind.
# pnpm 9 (used in CI) rejects this file without a packages field.
packages:
  - '.'
allowBuilds:
  esbuild: true
  protobufjs: true
